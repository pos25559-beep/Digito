<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#F8F9FA;overflow:hidden;font-family:Inter,sans-serif}
  canvas{display:block}
  body.clean .ov, body.clean .legend, body.clean .arrow{display:none!important}
  .ov{position:absolute;left:56px;top:48px;color:#202124}
  .kick{font-size:15px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#1A73E8}

  .legend{position:absolute;right:52px;bottom:44px;display:flex;gap:22px;font-size:15px;color:#3C4043}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px}
  .arrow{position:absolute;opacity:0;color:#C5221F;font-size:15px;font-weight:600;text-align:center}
  .arrow svg{display:block;margin:0 auto 6px}
</style></head>
<body class="clean">
<div class="ov"><div class="kick">Fabrico · FDM com dois bicos</div><div class="step"><span class="n" id="n">1</span><span id="t">Alinhar</span></div><div class="sub" id="s"></div><div class="lay mono" id="lay"></div></div>
<div class="arrow" id="ar" style="display:none"><svg width="34" height="70" viewBox="0 0 34 70"><path d="M17 68V8M4 21 17 6l13 15" fill="none" stroke="#C5221F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>30 N</div>
<div class="legend"><span><i style="background:#3C4043"></i>Capa · TPU 95A</span><span><i style="background:#1A73E8"></i>Insert · PETG</span><span><i style="background:#9AA0A6"></i>Bico 1 · TPU</span><span><i style="background:#8AB4F8"></i>Bico 2 · PETG</span></div>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); r.localClippingEnabled = true;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#F8F9FA');
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 2000); cam.up.set(0, 0, 1); cam.setViewOffset(W, H, -W * 0.1, -H * 0.02, W, H);
scene.add(new THREE.HemisphereLight('#ffffff', '#c9ccd1', 1.4));
const key = new THREE.DirectionalLight('#ffffff', 2.3); key.position.set(-40, -60, 90); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 300 }); key.shadow.bias = -0.0004; key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight('#dfe8ff', 0.9); rim.position.set(60, 70, 40); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.12 })); ground.position.z = -0.02; ground.receiveShadow = true; /* sem chão */

const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);   // constant 60 → nada cortado; 0 → corte a meio
const mats = {
  tpu: ['#4A4F55', 0.8, 0.0, '#6E7378'],
  insert: ['#1A73E8', 0.38, 0.0, '#4F8EF0'],
  grip: ['#E3E5E8', 0.5, 0.0, '#BDC1C6'],
  pillar: ['#4A4F55', 0.8, 0.0, '#80868B'],

const loader = new STLLoader(); const parts = {}; const caps = [];
let idx = 0;
async function load(n) {
  const g = await loader.loadAsync(`/eng/out/anim/${n}.stl`); g.computeVertexNormals();
  const [c, rough, met, sec] = mats[n]; const i = idx++;
  const grp = new THREE.Group();
  const base = { depthWrite: false, depthTest: false, colorWrite: false, stencilWrite: true, stencilFunc: THREE.AlwaysStencilFunc, clippingPlanes: [clip] };
  const mb = new THREE.MeshBasicMaterial({ ...base, side: THREE.BackSide, stencilFail: THREE.IncrementWrapStencilOp, stencilZFail: THREE.IncrementWrapStencilOp, stencilZPass: THREE.IncrementWrapStencilOp });
  const mfm = new THREE.MeshBasicMaterial({ ...base, side: THREE.FrontSide, stencilFail: THREE.DecrementWrapStencilOp, stencilZFail: THREE.DecrementWrapStencilOp, stencilZPass: THREE.DecrementWrapStencilOp });
  const sb = new THREE.Mesh(g, mb), sf = new THREE.Mesh(g, mfm); sb.renderOrder = sf.renderOrder = i + 1;
  const front = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: c, roughness: rough, metalness: met, clearcoat: n === 'insert' ? 0.4 : 0, clippingPlanes: [clip], side: THREE.FrontSide }));
  front.castShadow = true; front.receiveShadow = true; front.renderOrder = 10;
  grp.add(sb, sf, front); scene.add(grp); parts[n] = grp;
  const cap = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: sec, roughness: 0.9, metalness: 0,
    stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc, stencilFail: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilZPass: THREE.ReplaceStencilOp }));
  cap.renderOrder = i + 1.1; cap.onAfterRender = (rr) => rr.clearStencil(); scene.add(cap); caps.push(cap);
  return grp;
}
await Promise.all(['tpu', 'insert', 'pillar'].map(load));
function nozzle(col) { const g = new THREE.Group();
  const block = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 2.6), new THREE.MeshPhysicalMaterial({ color: '#C9CDD2', metalness: .55, roughness: .35 })); block.position.z = 4.4;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 32), new THREE.MeshPhysicalMaterial({ color: '#C8A24A', roughness: .3, metalness: .8 })); tip.rotation.x = -Math.PI / 2; tip.position.z = 1.5;
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 22, 24), new THREE.MeshPhysicalMaterial({ color: col, roughness: .5, transmission: .2 })); tube.rotation.x = Math.PI / 2; tube.position.z = 16.7;
  g.add(block, tip, tube); g.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(g); return g; }
const nz1 = nozzle('#80868B'), nz2 = nozzle('#4285F4');

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const outBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const DZP = -0.55, PR = 0.3, PTF = 2.7, RR = 2.55;

const elN = document.getElementById('n'), elT = document.getElementById('t'), elS = document.getElementById('s'), ar = document.getElementById('ar');
window.DUR = 10;
const LH = 0.2, TOP = 4.95, NL = Math.round(TOP / LH);
const STEPS = [
  [0, '1', 'Uma impressão, dois bicos', 'A capa e o insert saem da mesma placa, sem pausas.'],
  [1.6, '2', 'Fundo da capa em TPU', 'Bico 1, até z = 0,6 mm.'],
  [3.0, '3', 'TPU e PETG na mesma camada', 'Em cada camada, o bico 2 desenha o insert e o bico 1 a capa à volta.'],
  [7.4, '4', 'Tampa de TPU por cima', 'O insert fica preso pela forma hexagonal, sem cola.'],
  [8.6, '✓', 'Pronta a usar', 'A pega encaixa logo que a peça arrefece.'],
];
const elL = document.getElementById('lay');
window.frame = (t) => {
  const p = seg(t, 1.2, 8.4); const layer = Math.min(NL, Math.floor(p * NL + 1e-6)); const zc = t < 1.2 ? 0.001 : (t > 8.4 ? 10 : layer * LH + 0.0001);
  clip.constant = zc;
  // nozzles: activo desce à camada; o outro estaciona acima
  const inInsert = zc > 0.6 && zc < 4.35;
  const ph = (t * 3.2) % 2; const which = inInsert ? (ph < 1 ? 1 : 2) : 1;
  const zz = Math.min(zc, TOP) + 0.1;
  const fx = Math.sin(t * 7.1) * (which === 2 ? 6.5 : 13), fy = Math.cos(t * 5.3) * (which === 2 ? 6.5 : 13);
  const park1 = [-19, 17, zz + 6], park2 = [19, 17, zz + 6];
  if (t > 8.4) { nz1.position.set(-19, 17, 12); nz2.position.set(19, 17, 12); }
  else if (which === 1) { nz1.position.set(fx, fy, zz); nz2.position.set(...park2); }
  else { nz2.position.set(fx, fy, zz); nz1.position.set(...park1); }

  const a = THREE.MathUtils.degToRad(-58 + 20 * ease(seg(t, 0, DUR)));
  const dist = 90;
  cam.position.set(Math.cos(a) * dist * 0.8, Math.sin(a) * dist * 0.8, dist * 0.62);

  elN.textContent = s[1]; elT.textContent = s[2]; elS.textContent = s[3];
  elL.textContent = t < 1.2 ? '' : `camada ${String(Math.min(layer, NL)).padStart(2, '0')}/${NL} · z ${Math.min(layer * LH, TOP).toFixed(2).replace('.', ',')} mm`;
  for (const cp of caps) { clip.coplanarPoint(cp.position); cp.lookAt(cp.position.x - clip.normal.x, cp.position.y - clip.normal.y, cp.position.z - clip.normal.z); }
  r.render(scene, cam);

window.ready = true; frame(0);
</script></body></html>
